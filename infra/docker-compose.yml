services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: settlement_engine
      POSTGRES_USER: settlement_engine
      POSTGRES_PASSWORD: settlement_engine
    ports:
      - "5432:5432"
    volumes:
      - settlement_engine_postgres_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.8.0
    environment:
      # Required for the official image to format its storage on first boot -- without it,
      # formatting is silently skipped and the broker fails with "No readable meta.properties
      # files found." (found while deploying the same image to Kubernetes in Phase 6; this
      # container just never hit a truly fresh start locally since it has no declared volume
      # and tends to get reused across `docker compose up`/`stop` cycles rather than recreated).
      CLUSTER_ID: Uz0aojrmT1G9xgr4ZUQ1eQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"

volumes:
  settlement_engine_postgres_data:
