spring:
  application:
    name: settlement-engine
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SETTLEMENT_DB_URL:jdbc:postgresql://localhost:5432/settlement_engine}
    username: ${SETTLEMENT_DB_USER:settlement_engine}
    password: ${SETTLEMENT_DB_PASSWORD:settlement_engine}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: settlement-engine-read-model
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.settlementengine.core.events

settlement-engine:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
  refresh-token:
    ttl-days: ${REFRESH_TOKEN_TTL_DAYS:30}
  outbox:
    poll-fixed-delay-ms: ${OUTBOX_POLL_FIXED_DELAY_MS:500}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
