# Expects the postgres-credentials Secret (already created for 02-postgres.yaml) so the
# fraud-score-distribution dashboard can query fraud_assessments directly -- no new metric
# needed for that one. Not exposed through Traefik/Ingress: NodePort is simpler than sub-path
# routing, and Grafana has its own login screen.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: invoice-financing
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
      - name: Postgres
        type: postgres
        access: proxy
        url: postgres:5432
        database: $POSTGRES_DB
        user: $POSTGRES_USER
        secureJsonData:
          password: $POSTGRES_PASSWORD
        jsonData:
          sslmode: disable
          postgresVersion: 1600
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: invoice-financing
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: invoice-financing
        folder: Invoice Financing
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: invoice-financing
data:
  settlements.json: |
    {
      "title": "Settlements",
      "schemaVersion": 39,
      "panels": [
        {
          "type": "piechart",
          "title": "Settlement outcomes",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"expr": "sum by (outcome) (settlement_outcome_total)", "legendFormat": "{{outcome}}"}],
          "datasource": {"type": "prometheus", "uid": "Prometheus"}
        },
        {
          "type": "timeseries",
          "title": "Backend request latency (p95)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"expr": "histogram_quantile(0.95, rate(http_server_requests_seconds_bucket{job=\"backend\"}[5m]))", "legendFormat": "p95"}],
          "datasource": {"type": "prometheus", "uid": "Prometheus"}
        }
      ]
    }
  fraud.json: |
    {
      "title": "Fraud Detection",
      "schemaVersion": 39,
      "panels": [
        {
          "type": "histogram",
          "title": "Fraud score distribution",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{"rawSql": "SELECT score FROM fraud_assessments", "format": "table"}],
          "datasource": {"type": "postgres", "uid": "Postgres"}
        },
        {
          "type": "piechart",
          "title": "Fraud decisions",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{"rawSql": "SELECT decision, count(*) as value FROM fraud_assessments GROUP BY decision", "format": "table"}],
          "datasource": {"type": "postgres", "uid": "Postgres"}
        }
      ]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: invoice-financing
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: invoice-financing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:13.1.0
          envFrom:
            - secretRef:
                name: postgres-credentials
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-ui
  namespace: invoice-financing
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030
