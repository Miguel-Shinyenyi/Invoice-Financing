# Single-node KRaft mode, same image/version as infra/docker-compose.yml. Only the in-cluster
# PLAINTEXT listener is configured -- nothing outside the cluster needs to talk to Kafka
# directly, unlike the local docker-compose setup which also exposes a host listener.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: invoice-financing
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: invoice-financing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - containerPort: 9092
          env:
            # The official apache/kafka image needs this set explicitly to format its storage
            # on first boot -- without it, formatting is silently skipped and the broker fails
            # with "No readable meta.properties files found." Generated once via
            # `kafka-storage.sh random-uuid`; must stay fixed across restarts since it's tied
            # to this PVC's already-formatted storage.
            - name: CLUSTER_ID
              value: Uz0aojrmT1G9xgr4ZUQ1eQ
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            # localhost, not the k8s Service DNS name: this single pod is registering with
            # itself as the sole controller-quorum voter, so routing that through the Service
            # (ClusterIP -> kube-proxy iptables -> CoreDNS) adds indirection this same-pod
            # handshake doesn't need, and was the likely cause of intermittent
            # "channel manager timed out before sending the request" crashes on first boot.
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kafka-data
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: invoice-financing
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
