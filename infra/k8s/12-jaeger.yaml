# All-in-one, in-memory storage -- traces don't survive a pod restart. Acceptable for a
# portfolio demo; avoids standing up Elasticsearch/Cassandra just to hold ephemeral trace data.
# Jaeger 1.x, not 2.x: the jaegertracing/all-in-one Docker Hub repo hasn't published 2.x tags
# yet even though the GitHub source repo has (found while deploying -- ImagePullBackOff on
# 2.19.0). 1.x's all-in-one has OTLP enabled by default as of recent releases, confirmed
# explicitly here via COLLECTOR_OTLP_ENABLED rather than relying on that default.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: invoice-financing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.72.0
          env:
            - name: SPAN_STORAGE_TYPE
              value: memory
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 16686
              name: ui
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: invoice-financing
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: ui
      port: 16686
      targetPort: 16686
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
  namespace: invoice-financing
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - port: 16686
      targetPort: 16686
      nodePort: 30686
