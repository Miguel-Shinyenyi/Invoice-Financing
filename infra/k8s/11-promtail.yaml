# Ships container logs to Loki. Scoped to just this project's namespaces (invoice-financing,
# cert-manager) via relabel_configs -- this is a shared node with other tenants' pods also
# writing to /var/log/pods; there's no reason to ingest their logs into this project's Loki.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: invoice-financing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail-invoice-financing
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail-invoice-financing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail-invoice-financing
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: invoice-financing
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: invoice-financing
data:
  promtail-config.yaml: |
    server:
      http_listen_port: 9080
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://loki:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            regex: invoice-financing|cert-manager
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: invoice-financing
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.6.11
          args: ["-config.file=/etc/promtail/promtail-config.yaml"]
          # Container log files under the hostPath mount are root:root, mode 640 -- Promtail's
          # image doesn't run as root by default, so without this it silently can't read any of
          # them (found by checking file permissions directly after zero logs ever reached Loki).
          securityContext:
            runAsUser: 0
          # Promtail's kubernetes_sd_configs auto-scopes discovery to pods on its own node via a
          # spec.nodeName field selector, built from the HOSTNAME env var -- which in a pod
          # defaults to the pod's own name (e.g. "promtail-n2g2f"), not the actual Kubernetes
          # node name, silently producing a field selector that matches zero pods. Found via
          # /config on Promtail's own debug UI showing `field: spec.nodeName=promtail-n2g2f`.
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: positions
              mountPath: /run/promtail
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: pods-logs
          hostPath:
            path: /var/log/pods
        - name: positions
          emptyDir: {}
