# The fraud service with the lab routes on (ML_LAB=1): a log ring buffer and a time-boxed fault.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml
  namespace: settlement-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml
  template:
    metadata:
      labels:
        app: ml
    spec:
      containers:
        - name: ml
          image: localhost:15000/fraud-detection-ml:lab
          ports:
            - containerPort: 8000
          env:
            - { name: ML_LAB, value: "1" }
            - { name: OTEL_SERVICE_NAME, value: fraud-detection-ml }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://jaeger:4317" }
            - { name: OTEL_TRACES_EXPORTER, value: otlp }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: grpc }
            - { name: OTEL_METRICS_EXPORTER, value: none }
            - { name: OTEL_LOGS_EXPORTER, value: none }
            - { name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED, value: "false" }
            - { name: OTEL_PYTHON_LOG_CORRELATION, value: "true" }
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ml
  namespace: settlement-lab
spec:
  selector:
    app: ml
  ports:
    - port: 8000
      targetPort: 8000
