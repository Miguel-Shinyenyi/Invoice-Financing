# Internal only -- called by the backend before disbursement, never exposed outside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection-ml
  namespace: invoice-financing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-detection-ml
  template:
    metadata:
      labels:
        app: fraud-detection-ml
    spec:
      containers:
        - name: fraud-detection-ml
          image: localhost:15000/fraud-detection-ml:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-detection-ml
  namespace: invoice-financing
spec:
  selector:
    app: fraud-detection-ml
  ports:
    - port: 8000
      targetPort: 8000
