# Static scrape targets, not Kubernetes service discovery -- this is a fixed, small set of
# services on a single-node cluster, not worth the extra RBAC a kubernetes_sd_config needs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: invoice-financing
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]
    rule_files:
      - /etc/prometheus/rules.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: backend
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["backend:8080"]
      - job_name: ml-service
        metrics_path: /metrics
        static_configs:
          - targets: ["fraud-detection-ml:8000"]
  rules.yml: |
    groups:
      - name: invoice-financing
        rules:
          - alert: BackendDown
            expr: up{job="backend"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Backend has not been scrapeable for 1 minute"
          - alert: MLServiceDown
            expr: up{job="ml-service"} == 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Fraud-detection ml-service has not been scrapeable for 1 minute (backend fails open, financing still works, but fraud signal is degraded)"
          - alert: SettlementFailureRateSpike
            expr: rate(settlement_outcome_total{outcome="FAILED"}[5m]) / rate(settlement_outcome_total[5m]) > 0.5
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Over half of settlements are FAILing (5m window)"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: invoice-financing
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: invoice-financing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: invoice-financing
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-ui
  namespace: invoice-financing
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
